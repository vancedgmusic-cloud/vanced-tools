  },
  caphash(){
    return head('08','Caption & Hashtag','Caption: Hook → Experience → Benefit → CTA (2 versi). Hashtag: set terpisah TikTok vs Shopee Video.')+
    '<div class="card">'+aiToolbar('caphash','Buat caption + hashtag')+
    '<label>Caption — versi utama</label><textarea data-path="caption.utama" style="min-height:90px">'+esc(state.caption.utama)+'</textarea>'+
    '<div class="toolbar" style="margin:6px 0 12px"><button class="btn small" data-copy="caption.utama">📋 Salin caption utama</button></div>'+
    '<label>Caption — versi alternatif</label><textarea data-path="caption.alternatif" style="min-height:90px">'+esc(state.caption.alternatif)+'</textarea>'+
    '<div class="toolbar" style="margin:6px 0 12px"><button class="btn small" data-copy="caption.alternatif">📋 Salin caption alternatif</button></div>'+
    '<div class="mini">Hashtag TikTok</div><textarea class="tagbox" data-path="hashtag.tiktok">'+esc(state.hashtag.tiktok)+'</textarea>'+
    '<div class="toolbar" style="margin:6px 0 12px"><button class="btn small" data-copy="hashtag.tiktok">📋 Salin tag TikTok</button></div>'+
    '<div class="mini">Hashtag Shopee Video</div><textarea class="tagbox" data-path="hashtag.shopee">'+esc(state.hashtag.shopee)+'</textarea>'+
    '<div class="toolbar" style="margin:6px 0 0"><button class="btn small" data-copy="hashtag.shopee">📋 Salin tag Shopee</button></div>'+
    reviseBox('caphash')+'</div>';
  },
  export(){
    const checks=validate();
    return head('09','Validasi & Ekspor','Quality control otomatis terhadap aturan framework, lalu ekspor seluruh dokumen kerja.')+
    '<div class="card"><h3>Hasil validasi</h3>'+checks.map(c=>'<div class="check '+c.level+'"><span class="sym">'+(c.level==='ok'?'✓':c.level==='warn'?'!':'✕')+'</span><span>'+esc(c.msg)+'</span></div>').join('')+'</div>'+
    '<div class="card"><h3>Ekspor</h3><div class="toolbar" style="margin-bottom:0">'+
    '<button class="btn primary" id="btnMdDown">⬇ Unduh Markdown (.md)</button>'+
    '<button class="btn" id="btnMdCopy">📋 Salin Markdown</button>'+
    '<button class="btn" id="btnJsonDown">💾 Simpan project (.json)</button>'+
    '</div><div class="hint" style="margin-top:10px">File .json bisa dipindah ke device/browser lain lewat tombol 📂 Buka di atas — ini cadangan permanen di luar browser ini.</div></div>'+
    '<div class="card"><h3>Penyimpanan Browser (Local Storage)</h3>'+
    '<div class="hint" style="margin-top:0">Project ini otomatis tersimpan di local storage browser yang kamu pakai sekarang — tetap ada walau tab ditutup atau ke-refresh, baik dibuka di Claude.ai maupun browser biasa (kalau local storage didukung/tidak diblokir mode privat). API key TIDAK ikut tersimpan di sini, tetap hanya di memori sesi ini — pakai .json di atas untuk memindahkan project ke device/browser lain.</div>'+
    '<div class="toolbar" style="margin-top:10px"><button class="btn small danger" id="btnClearLocal">🗑 Hapus data lokal</button></div></div>';
  }
};
function renderPanel(){
  $('#main').innerHTML=(PANELS[currentStep]||PANELS.setup)();
  if(busy) document.querySelectorAll('.needidle').forEach(el=>el.disabled=true);
  const b=$('#btnPipelineHere'); if(b) b.onclick=runAll;
  if(currentStep==='export'){
    $('#btnMdDown').onclick=()=>download((state.setup.nama||'storyboard').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').toLowerCase()+'-brain-director.md', md(),'text/markdown');
    $('#btnMdCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(md()); toast('Markdown tersalin.','ok'); }catch(e){ toast('Gagal menyalin — unduh saja filenya.','err'); } };
    $('#btnJsonDown').onclick=saveProject;
    $('#btnClearLocal').onclick=()=>{
      if(!confirm('Hapus data project yang tersimpan otomatis di browser ini? File .json yang sudah kamu unduh tidak akan terpengaruh.')) return;
      try{ localStorage.removeItem(LS_KEY); toast('Data lokal dihapus.','ok'); }
      catch(e){ toast('Tidak bisa mengakses local storage di browser ini.','err'); }
    };
  }
  const cab=$('#btnCopyAllPrompts');
  if(cab) cab.onclick=async()=>{
    const txt=state.prompts.map((p,i)=>'=== SCENE '+(i+1)+' — VIDEO PROMPT ===\n'+(p.video||'')+'\n\n=== SCENE '+(i+1)+' — IMAGE PROMPT ===\n'+(p.image||'')).join('\n\n');
    try{ await navigator.clipboard.writeText(txt); toast('Semua prompt tersalin ke clipboard.','ok'); }
    catch(e){ toast('Clipboard diblokir browser — salin per scene saja.','err'); }
  };
  const add=$('#btnAddScene');
  if(add) add.onclick=()=>{
    if(state.scenes.length>=5){ toast('Maksimal 5 scene — hapus salah satu dulu kalau mau menambah.','err'); return; }
    const rows=Math.max(2,Math.round((+state.setup.durasi||10)/2));
    state.scenes.push({fokus:'',visual_utama:'',mood:'',background:'',cta:'-',
      timeline:Array.from({length:rows},(_,r)=>({waktu:(r*2)+'–'+((r+1)*2)+' dtk',visual:'',action:'',audio:'',dialog:'',camera:'',transisi:''})),
      detail_produk:[],continuity_lock:state.scenes[0]?.continuity_lock||''});
    /* BUGFIX: tambah scene kosong manual tidak menandai storyboard/prompts stale,
       padahal hapus scene (delscene) sudah — disamakan agar konsisten. */
    state.dirty.storyboard=true; if(state.prompts.length) state.dirty.prompts=true;
    renderPanel(); renderRail();
  };
  if(currentStep==='input') setupInputPanel();
}
function setupInputPanel(){
  const ts=$('#temaVisualSelect'); if(ts) ts.value=state.input.temaVisual||'custom';
  const cs=$('#gayaKameraSelect'); if(cs) cs.value=state.input.gayaKamera||'cam_iphone15';
  syncCustomVisibility();
  const ti=$('#talentImageInput'); if(ti) ti.onchange=handleTalentUpload;
  const pi=$('#productImageInput'); if(pi) pi.onchange=handleProductUpload;
  const rb=$('#btnRisetLokasi'); if(rb) rb.onclick=runLocationResearch;
  renderUploadThumbs();
  renderThemeResearchBox();
}
function syncCustomVisibility(){
  const temaCustom=$('#temaVisualCustomInput'), temaHint=$('#temaVisualHint'), risetBtn=$('#btnRisetLokasi');
  const isTemaCustom=(state.input.temaVisual||'custom')==='custom';
  if(temaCustom) temaCustom.hidden=!isTemaCustom;
  if(temaHint) temaHint.hidden=!isTemaCustom;
  if(risetBtn) risetBtn.hidden=!isTemaCustom;
  const kamCustom=$('#gayaKameraCustomInput');
  if(kamCustom) kamCustom.hidden=(state.input.gayaKamera||'cam_iphone15')!=='custom';
}
function render(){ renderRail(); renderPanel(); persistState(); }

/* ---------------- project save/load ---------------- */
const LS_KEY='brainDirectorProject_v1';
/* IDE BARU: penyimpanan otomatis via localStorage — supaya aplikasi ini tidak cuma jalan
   di dalam Claude.ai (provider "builtin"), tapi juga aman dipakai standalone di browser
   biasa / GitHub Pages tanpa kehilangan progres tiap kali tab ditutup atau ke-refresh.
   API key SENGAJA tetap tidak ikut tersimpan di sini — sama seperti .json — hanya konten
   project (setup, input, hasil AI, scene, prompt, caption, hashtag) yang di-autosave. */
function snapshotForStorage(){
  const snap=JSON.parse(JSON.stringify(state));
  snap.api={...snap.api, claudeKey:'',geminiKey:'',groqKey:'',orKey:'',customKey:''};
  return snap;
}
let persistTimer=null;
function persistState(){
  clearTimeout(persistTimer);
  persistTimer=setTimeout(()=>{
    try{ localStorage.setItem(LS_KEY, JSON.stringify(snapshotForStorage())); }
    catch(e){ /* localStorage tidak tersedia/diblokir (mode privat, sandbox tertentu, dll)
                 — diamkan saja, ekspor .json tetap jadi cara simpan cadangan yang selalu ada */ }
  }, 400);
}
function mergeLoadedState(d, restoreApi){
  const keepApi=state.api;
  /* BUGFIX: merge di atas struktur default, bukan timpa mentah — file/data versi lama
     yang tidak punya field baru (tema visual, uploads, dll) tidak lagi merusak state. */
  ['setup','input','caption','hashtag','done','dirty'].forEach(k=>{ if(d[k]&&typeof d[k]==='object') state[k]={...state[k],...d[k]}; });
  ['knowledge','marketing','angle','brief'].forEach(k=>{ if(d[k]&&typeof d[k]==='object') state[k]=d[k]; });
  ['scenes','prompts'].forEach(k=>{ if(Array.isArray(d[k])) state[k]=d[k]; });
  if(d.uploads&&typeof d.uploads==='object') state.uploads={talentImage:d.uploads.talentImage||null, productImages:Array.isArray(d.uploads.productImages)?d.uploads.productImages:[]};
  state.setup.jumlahScene=Math.max(2,Math.min(5,Math.round(+state.setup.jumlahScene)||3));
  state.api=(restoreApi&&d.api&&typeof d.api==='object')?{...keepApi,...d.api}:keepApi;
  if(state.uploads?.talentImage) state.uploads.talentImage.url='data:'+state.uploads.talentImage.mimeType+';base64,'+state.uploads.talentImage.data;
  (state.uploads?.productImages||[]).forEach(img=>{ img.url='data:'+img.mimeType+';base64,'+img.data; });
}
function tryRestoreLocal(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw) return false;
    const d=JSON.parse(raw);
    mergeLoadedState(d, true);
    return !!(d.setup?.nama || d.input?.deskripsi || (d.scenes&&d.scenes.length) || (d.prompts&&d.prompts.length) || d.caption?.utama);
  }catch(e){ return false; }
}
function saveProject(){
  const snap=snapshotForStorage();
  download((state.setup.nama||'project').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').toLowerCase()+'-brain-director.json', JSON.stringify(snap,null,2),'application/json');
  toast('Project disimpan sebagai .json (API key tidak ikut disimpan).','ok');
}
function loadProject(file){
  const rd=new FileReader();
  rd.onload=()=>{ try{
    const d=JSON.parse(rd.result);
    mergeLoadedState(d, false);
    toast('Project dimuat.','ok'); go('setup');
  }catch(e){ toast('File project tidak valid.','err'); } };
  rd.readAsText(file);
}

/* ---------------- API modal ---------------- */
function renderApiModal(){
  $('#provGrid').innerHTML=PROVIDERS.map(p=>'<button class="prov '+(state.api.provider===p.id?'sel':'')+'" data-prov="'+p.id+'"><b>'+p.name+'</b><span>'+p.desc+'</span></button>').join('');
  const a=state.api; let f='';
  if(a.provider==='claude') f=
    '<div class="field"><label>Anthropic API Key</label><input type="password" data-path="api.claudeKey" value="'+esc(a.claudeKey)+'" placeholder="sk-ant-…"></div>'+
    '<div class="field"><label>Model</label><input data-path="api.claudeModel" value="'+esc(a.claudeModel)+'"></div>';
  if(a.provider==='gemini') f=
    '<div class="field"><label>Gemini API Key</label><input type="password" data-path="api.geminiKey" value="'+esc(a.geminiKey)+'" placeholder="AIza…"></div>'+
    '<div class="field"><label>Model</label><input data-path="api.geminiModel" value="'+esc(a.geminiModel)+'" placeholder="gemini-2.5-flash / gemini-2.5-pro"></div>';
  if(a.provider==='groq') f=
    '<div class="field"><label>Groq API Key</label><input type="password" data-path="api.groqKey" value="'+esc(a.groqKey)+'" placeholder="gsk_…"></div>'+
    '<div class="field"><label>Model</label><input data-path="api.groqModel" value="'+esc(a.groqModel)+'" placeholder="llama-3.3-70b-versatile · llama-3.1-8b-instant"></div>';
  if(a.provider==='openrouter') f=
    '<div class="field"><label>OpenRouter API Key</label><input type="password" data-path="api.orKey" value="'+esc(a.orKey)+'" placeholder="sk-or-…"></div>'+
    '<div class="field"><label>Model</label><input data-path="api.orModel" value="'+esc(a.orModel)+'" placeholder="openai/gpt-4o-mini · anthropic/claude-sonnet-4.5 · google/gemini-2.5-flash"></div>';
  if(a.provider==='custom') f=
    '<div class="field"><label>Base URL</label><input data-path="api.customBase" value="'+esc(a.customBase)+'" placeholder="https://api.openai.com/v1 · https://api.groq.com/openai/v1 · https://openrouter.ai/api/v1"></div>'+
    '<div class="field"><label>API Key</label><input type="password" data-path="api.customKey" value="'+esc(a.customKey)+'"></div>'+
    '<div class="field"><label>Model</label><input data-path="api.customModel" value="'+esc(a.customModel)+'"></div>';
  $('#provFields').innerHTML=f;
  const common='Key hanya hidup di memori tab ini (tidak disimpan di mana pun, tidak ikut file .json) dan dikirim langsung ke endpoint resmi provider dari browser-mu. Semua provider punya retry otomatis kalau server sibuk.';
  const notes={
    builtin:'Mode bawaan memakai Claude langsung dari lingkungan Claude.ai — tanpa API key. Kalau kamu mengunduh file HTML ini dan membukanya di luar Claude.ai, pilih salah satu provider ber-key.',
    groq:'Key gratis bisa dibuat di console.groq.com/keys (login lalu Create API Key). Groq sangat cepat dan cocok saat provider lain sedang penuh. '+common,
    openrouter:'Key dibuat di openrouter.ai/keys — satu key untuk ratusan model dari berbagai vendor, tinggal ganti nama model. '+common
  };
  $('#provNote').textContent = notes[a.provider]||common;
}
async function testApi(){
  const sel=state.api.provider;
  try{ setBusy(true,'Tes koneksi '+providerName(sel)+'…');
    /* Sengaja callProvider, bukan callAI: tombol ini harus menguji provider yang
       DIPILIH user. Lewat callAI, failover bisa menutupi provider yang rusak dan
       melaporkan "berhasil" padahal yang menjawab provider lain. */
    const r=await callProvider(sel,'Balas HANYA JSON: {"ok":true}',60);
    parseJSONLoose(r); toast('Koneksi '+providerName(sel)+' berhasil ✓','ok');
    const cad=fallbackChain();
    toast(cad.length
      ? 'Cadangan siap: '+cad.map(providerName).join(' → ')
      : 'Belum ada provider cadangan — isi satu API key lain agar pipeline tidak berhenti saat server sibuk.',
      cad.length?'ok':'warn');
  }catch(e){ toast(e.message,'err'); }
  finally{ setBusy(false); }
}

/* ---------------- events ---------------- */
document.addEventListener('input', e=>{
  if(busy) return; /* BUGFIX: cegah edit tertelan/tertimpa saat AI sedang menulis state */
  const p=e.target.dataset.path; if(!p) return;
  let v=e.target.value; if(e.target.type==='number') v=+v;
  if(e.target.dataset.detail!=null){
    setPath(state,'scenes.'+e.target.dataset.detail+'.detail_produk', v.split('\n').map(x=>x.trim()).filter(Boolean));
  } else setPath(state,p,v);
  /* BUGFIX: perubahan jumlah scene kini menandai storyboard & prompts "PERLU REGENERASI",
     supaya jumlah scene di setup dan hasil generate tidak diam-diam berbeda. */
  if(p==='setup.jumlahScene' && state.scenes.length && totalScenes()!==state.scenes.length){
    state.dirty.storyboard=true; state.dirty.prompts=true;
  }
  /* IDE BARU: perubahan bahan dasar (deskripsi, talent, tema, gaya suara, dll) otomatis
     mencap semua tahap AI yang sudah berisi sebagai "PERLU REGENERASI". */
  if(p.startsWith('input.')||['setup.mode','setup.suara','setup.bahasa','setup.platform','setup.durasi'].includes(p)){
    REGEN_ORDER.forEach(id=>{ if(hasContent(id)) state.dirty[id]=true; });
  }
  if(p.startsWith('setup.')||p.startsWith('input.')) renderRail();
  if(p==='input.temaVisual'||p==='input.gayaKamera') syncCustomVisibility();
  persistState();
});
document.addEventListener('click', async e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.go){ go(t.dataset.go); return; }
  if(t.dataset.gen){ runStage(t.dataset.gen,''); return; }
  if(t.dataset.rev){ const id=t.dataset.rev; const fb=($('#rev-'+id)?.value||'').trim(); if(!fb){toast('Tulis dulu feedback revisinya.','err');return;} runStage(id,fb); return; }
  if(t.dataset.regenscene){ if(busy) return; const n=+t.dataset.regenscene;
    try{ setBusy(true,'Regenerasi scene '+n+'…'); await genScene(n,'');
      if(state.prompts[n-1]){ state.dirty.prompts=true; toast('Scene '+n+' diperbarui — prompt video/image scene ini kedaluwarsa, regenerasi di tahap 07.','ok'); }
      else toast('Scene '+n+' diperbarui.','ok'); }
    catch(err){ toast(err.message,'err'); } finally{ setBusy(false); render(); } return; }
  if(t.dataset.delscene!=null){ state.scenes.splice(+t.dataset.delscene,1); state.prompts.splice(+t.dataset.delscene,1);
    if(state.prompts.length) state.dirty.prompts=true; if(state.scenes.length) state.dirty.storyboard=true; render(); return; }
  if(t.dataset.copy){ const v=getPath(state,t.dataset.copy)||''; try{ await navigator.clipboard.writeText(v); toast('Tersalin.','ok'); }catch(err){ toast('Clipboard diblokir browser.','err'); } return; }
  if(t.dataset.prov){ state.api.provider=t.dataset.prov; renderApiModal(); return; }
  if(t.dataset.rmtalent){ removeTalentImage(); return; }
  if(t.dataset.rmproduct!=null){ removeProductImage(+t.dataset.rmproduct); return; }
});
/* Normalisasi angka jumlah scene saat user selesai mengetik (blur/change) — nilai kosong/di luar 2–5 dirapikan */
document.addEventListener('change', e=>{
  if(e.target?.dataset?.path==='setup.jumlahScene'){ state.setup.jumlahScene=totalScenes(); e.target.value=state.setup.jumlahScene; renderRail(); }
});
/* IDE BARU: pelindung kerja — ingatkan sebelum menutup tab kalau ada hasil yang belum diekspor */
window.addEventListener('beforeunload', e=>{
  if(!busy && (state.scenes.length||state.prompts.length||state.caption.utama)){ e.preventDefault(); e.returnValue=''; }
});
$('#btnGenAll').onclick=runAll; $('#btnGenAll').classList.add('needidle');
$('#btnApi').onclick=()=>{ renderApiModal(); $('#apiOverlay').classList.add('open'); };
$('#btnCloseApi').onclick=()=>$('#apiOverlay').classList.remove('open');
$('#apiOverlay').addEventListener('click',e=>{ if(e.target.id==='apiOverlay') $('#apiOverlay').classList.remove('open'); });
$('#btnTestApi').onclick=testApi;
$('#btnSave').onclick=saveProject;
$('#btnLoad').onclick=()=>$('#fileInput').click();
$('#fileInput').addEventListener('change',e=>{ if(e.target.files[0]) loadProject(e.target.files[0]); e.target.value=''; });
$('#assistBtn').onclick=adaptRequest; $('#assistBtn').classList.add('needidle');
$('#assistInput').addEventListener('keydown',e=>{ if(e.key==='Enter') adaptRequest(); });

if(tryRestoreLocal()) toast('Sesi sebelumnya dipulihkan dari penyimpanan browser ini.','ok');
render();
